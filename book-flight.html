<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/book-flight.css">
</head>
<body>
<div class="screen">
  <header class="header">
    <button class="icon-btn" type="button" aria-label="Back" onclick="history.back()">
      <img src="assets/icons/arrow-left.svg" alt="">
    </button>
    <p class="header-title">Book Flight</p>
  </header>

  <form class="form" id="flight-form">
    <div class="trip-toggle" role="tablist" aria-label="Trip type">
      <button type="button" class="pill pill--active" id="round-trip-btn" role="tab" aria-selected="true">Round Trip</button>
      <button type="button" class="pill" id="one-way-btn" role="tab" aria-selected="false">One Way Trip</button>
    </div>

    <div class="route-row">
      <div class="route-fields">
        <label class="input-field">
          <span class="code">DEL</span>
          <span class="value">New Delhi</span>
        </label>
        <label class="input-field">
          <span class="code">To</span>
          <span class="value value--ghost">City</span>
        </label>
      </div>
      <button type="button" class="icon-btn" id="swap-btn" aria-label="Swap origin and destination">
        <img src="assets/icons/arrow-up-down.svg" alt="">
      </button>
    </div>

    <div class="field-row">
      <div class="input-group">
        <span class="input-label">Departure</span>
        <label class="input-field input-field--boxed">
          <span class="value value--ghost">Departure</span>
          <img src="assets/icons/calendar.svg" alt="">
        </label>
      </div>
      <div class="input-group">
        <span class="input-label">Return</span>
        <label class="input-field input-field--boxed">
          <span class="value value--ghost">Arrival</span>
          <img src="assets/icons/calendar.svg" alt="">
        </label>
      </div>
    </div>

    <div class="field-row">
      <div class="input-group">
        <span class="input-label">Traveller(s)</span>
        <label class="input-field input-field--boxed">
          <span class="value value--filled">1</span>
          <img src="assets/icons/users.svg" alt="">
        </label>
      </div>
      <div class="input-group">
        <span class="input-label">Travel Class</span>
        <label class="input-field input-field--boxed">
          <span class="value value--filled">Economy</span>
          <img src="assets/icons/armchair.svg" alt="">
        </label>
      </div>
    </div>

    <button type="submit" class="search-btn" id="search-btn" disabled>Search</button>

    <div class="promo-card">
      <img class="promo-plane" src="assets/icons/promo-plane.svg" alt="">
      <img class="promo-photo" src="assets/images/plane.png" alt="">
      <p class="promo-text">
        <span class="promo-line">
          <span class="promo-small">Book</span>
          <span class="promo-bold">Flights</span>
          <span class="promo-small">with No Convenience fee</span>
        </span>
        <span class="promo-tiny">on every flight booking</span>
      </p>
    </div>
  </form>

  <section class="why-card">
    <p class="why-title">Why Choose Hoi For Flight Booking?</p>
    <div class="why-list">
      <div class="why-item">
        <div class="why-icon"><img src="assets/icons/feature-tracking.svg" alt=""></div>
        <p class="why-label">Automated Flight Tracking</p>
      </div>
      <div class="why-item">
        <div class="why-icon"><img src="assets/icons/feature-offers.svg" alt=""></div>
        <p class="why-label">Best Offers</p>
      </div>
      <div class="why-item">
        <div class="why-icon"><img src="assets/icons/feature-support.svg" alt=""></div>
        <p class="why-label">24x7 Support</p>
      </div>
    </div>
  </section>
</div>
<script src="js/book-flight.js"></script>
</body>
</html>
